apply plugin: 'com.android.application'

android {
    namespace 'com.research.watchbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.research.watchbridge"
        minSdk 30
        targetSdk 34
        versionCode 13
        versionName "1.7-stepdetect"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {}
