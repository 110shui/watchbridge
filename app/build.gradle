apply plugin: 'com.android.application'

android {
    namespace 'com.research.watchbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.research.watchbridge"
        minSdk 30
        targetSdk 34
        versionCode 5
        versionName "1.4-hrsensor"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {}
