apply plugin: 'com.android.application'

android {
    namespace 'com.research.watchbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.research.watchbridge"
        minSdk 30
        targetSdk 34
        versionCode 11
        versionName "1.6-sync-remote"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {}
